# CI for wauploader — a five-stage pipeline: audit → test → build → verify →
# release.
#
# Why the stages are split the way they are:
#   - audit runs FIRST and stays cheap. It fails hard on a broken module
#     state (go mod verify, go mod tidy -diff) and on known vulnerabilities,
#     but an outdated dependency is only a WARNING: a fresh minor bump must
#     never block master.
#   - test runs the repository's own gate as separate steps (gofmt → vet →
#     lint → tests) so a red job names the stage that broke.
#   - build cross-compiles every release target on ONE runner and uploads the
#     binaries as artifacts.
#   - verify DOWNLOADS those artifacts and EXECUTES them (-h and -v) on the
#     runner that matches each target, so a broken binary fails the pipeline
#     instead of reaching a release.
#   - release publishes a GitHub Release, but only for a v* tag: the binaries
#     that were built and verified are attached to it. On every other trigger
#     the job is skipped, so a push to main never publishes anything.
#
# The GitHub-hosted runner images ship only the three latest Go minors
# (1.24/1.25/1.26), while go.mod requires go 1.27. Therefore every Go job
# uses actions/setup-go with `go-version-file: go.mod`: it reads the `go`
# directive and resolves the latest 1.27.x patch. A hardcoded `go-version:`
# would resolve to a toolchain the module does not accept.
#
# Only official actions are used (actions/*, golangci/*, docker/*), each
# pinned to a major version. The only credential is the automatic GITHUB_TOKEN,
# and it is used by the release stage alone. No pull_request_target.

name: CI

on:
  push:
    branches:
      - main
    # A v* tag runs the whole pipeline (audit → test → build → verify) and
    # ends in the release stage, which publishes a GitHub Release for the tag.
    # Both filters are listed, so a push to main and a push of a v* tag each
    # trigger the workflow on their own.
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per ref. A new push to a pull request cancels the previous run;
  # runs on main are queued instead of cancelled so no build is ever lost.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------- stage 1
  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Report the toolchain in use
        run: |
          {
            echo "## Toolchain"
            echo ""
            echo '```'
            go version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          go version

      - name: Download the modules
        # `go mod verify` only checks the modules that are already extracted in
        # the module cache — it never downloads anything. setup-go saves its
        # cache in the post step, so on a cold cache the check would pass over
        # an empty cache and prove nothing. Downloading first makes the check
        # unconditional.
        #
        # Not `all`: `go mod download all` records the h1: hashes of the
        # test-only dependencies of the dependencies in go.sum, and the
        # `go mod tidy -diff` gate below would then fail on the extra lines.
        # Without `all` the go command downloads the modules the build needs —
        # the ones whose content go.sum can actually verify — and leaves
        # go.sum untouched.
        run: go mod download

      - name: Verify the module cache
        # Fails when a module in go.sum does not match the downloaded content.
        run: go mod verify

      - name: Check that go.mod and go.sum are tidy
        # `go mod tidy -diff` prints the diff it would apply and exits
        # non-zero when the diff is not empty (Go 1.23+). The files are never
        # modified by the check itself.
        run: go mod tidy -diff

      - name: Install govulncheck
        # Pinned exactly as docs/lint.md documents it. The binary must be
        # built with the same Go major/minor as the module (docs/lint.md).
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Vulnerability scan
        run: govulncheck ./...

      - name: Dependency currency report
        # Outdated modules are reported, never enforced: a direct dependency
        # that is one minor behind must not block master.
        run: |
          set -uo pipefail

          main_module="$(go list -m -f '{{.Path}}')"
          updates_file="$(mktemp)"
          errors_file="$(mktemp)"

          if ! go list -u -m -f '{{if .Update}}{{.Path}}|{{.Version}}|{{.Update.Version}}|{{if .Indirect}}no{{else}}yes{{end}}{{end}}' all > "$updates_file" 2> "$errors_file"; then
            echo "::warning::could not query the module proxy for updates; the currency report is skipped"
            cat "$errors_file"
            exit 0
          fi

          {
            echo "## Dependency currency"
            echo ""
            echo "| Module | Current | Latest | Direct |"
            echo "| :-- | :-- | :-- | :-- |"
          } >> "$GITHUB_STEP_SUMMARY"

          direct_outdated=0
          while IFS='|' read -r path current latest direct; do
            [ -n "$path" ] || continue
            [ "$path" = "$main_module" ] && continue
            echo "| \`$path\` | $current | $latest | $direct |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$direct" = "yes" ]; then
              direct_outdated=$((direct_outdated + 1))
              echo "::warning title=Outdated direct dependency::$path $current -> $latest"
            fi
          done < "$updates_file"

          {
            echo ""
            if [ "$direct_outdated" -gt 0 ]; then
              echo "Outdated direct dependencies: $direct_outdated. Reported as a warning only — a fresh minor bump must not block master."
            else
              echo "Every direct dependency is up to date."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Outdated direct dependencies: $direct_outdated"

  # ---------------------------------------------------------------- stage 2
  test:
    name: test (${{ matrix.runner }})
    needs: audit
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The race detector must be green on arm64 as well, so the suite runs
        # on a native arm64 runner (ubuntu-24.04-arm) next to the x64 one.
        # Both run the repository's own `make test` target unchanged.
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting gate (make check)
        run: make check

      - name: Vet (make vet)
        run: make vet

      - name: Lint (golangci-lint v2.14.0)
        # This action replaces the `make lint` target: it runs the very same
        # `golangci-lint run` in the repository root (the same .golangci.yml),
        # but it also pins the linter binary to the version docs/lint.md
        # requires (v2.14.0). The binary↔toolchain pairing landmine from
        # docs/lint.md is the reason the version is pinned here.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=5m

      - name: Tests (make test)
        run: make test

  # ---------------------------------------------------------------- stage 3
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    # One runner cross-compiles every target: Go cross-compiles without a C
    # toolchain as long as CGO is off, and this keeps the matrix cheap.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: "386"
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # `git describe --tags` needs the tags, so the history is fetched
          # completely; a shallow clone would stamp a bare SHA instead.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          set -euo pipefail

          # The version of a tag build is the TRIGGERING tag, not whatever
          # `git describe` happens to pick. A commit can carry more than one
          # tag, and `describe --tags` prefers an annotated tag over a
          # lightweight one: with an annotated `v0.1.0` AND the lightweight
          # `v0.2.0` that triggered the run on the same commit, `describe`
          # reports `v0.1.0`. The release stage would then reject every
          # artifact as a version mismatch and publish nothing, while build
          # and verify stayed green.
          #
          # `$GITHUB_REF` is the default environment variable and holds
          # exactly the `github.ref` context value: `refs/tags/<tag>` for a
          # tag build, `refs/heads/<branch>` or `refs/pull/<n>/merge`
          # otherwise. The `refs/tags/v*` pattern is the same test the
          # release stage gates on, so the version that is stamped here and
          # the version the release stage expects cannot drift apart.
          # Branch and PR builds keep the describe behaviour, including its
          # `-dirty` suffix.
          #
          # `git describe` needs the tags, which the `fetch-depth: 0`
          # checkout above fetches.
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF#refs/tags/}" ;;
            *) version="$(git describe --tags --always --dirty 2>/dev/null || echo dev)" ;;
          esac

          exe="wauploader"
          if [ "$GOOS" = "windows" ]; then
            exe="wauploader.exe"
          fi

          out="dist/${GOOS}-${GOARCH}/${exe}"
          mkdir -p "dist/${GOOS}-${GOARCH}"
          echo "Building ${out} (version ${version})"

          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X github.com/4q4r/wauploader/internal/version.Version=${version}" \
            -o "$out" .

          # Publish the version that was stamped into the binary next to it, so
          # the verify stage can assert that `-v` prints exactly this string
          # (a wrong -X path would otherwise slip through).
          printf '%s\n' "$version" > "dist/${GOOS}-${GOARCH}/VERSION"

          ls -l "dist/${GOOS}-${GOARCH}"

      - name: Upload the binary
        uses: actions/upload-artifact@v7
        with:
          name: wauploader-${{ matrix.goos }}-${{ matrix.goarch }}
          # The whole target directory: the binary and the VERSION file that
          # carries the stamped version. upload-artifact uses that directory as
          # the artifact root, so both land at the top of the artifact.
          path: dist/${{ matrix.goos }}-${{ matrix.goarch }}/
          if-no-files-found: error
          retention-days: 7
          # Binaries are already compressed-ish; skip the extra CPU cost.
          compression-level: 0

  # ---------------------------------------------------------------- stage 4
  verify:
    name: verify ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
          - goos: linux
            goarch: "386"
            # A static Go 386 binary runs on x86_64 through the kernel's ia32
            # support — no 32-bit runtime libraries are needed.
            runner: ubuntu-24.04
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: linux
            goarch: arm
            goarm: "7"
            runner: ubuntu-24.04
            # armv7 has no native runner: QEMU emulates it on the x64 runner.
            qemu: true
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
          - goos: darwin
            goarch: arm64
            runner: macos-15
          - goos: windows
            goarch: amd64
            runner: windows-2025
          - goos: windows
            goarch: arm64
            runner: windows-11-arm
    defaults:
      run:
        shell: bash
    steps:
      - name: Download the binary
        uses: actions/download-artifact@v8
        with:
          name: wauploader-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist

      - name: Set up QEMU for the armv7 target
        if: matrix.qemu
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Check -h and -v (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail

          bin="dist/wauploader"
          if [ ! -f "$bin" ]; then
            # `find -print | sed -n '1p'` is portable: macOS/BSD find has no
            # -quit, and sed consumes the whole stream, so there is no SIGPIPE
            # to trip pipefail.
            bin="$(find dist -type f -name wauploader -print 2>/dev/null | sed -n '1p' || true)"
          fi
          if [ -z "$bin" ] || [ ! -f "$bin" ]; then
            echo "::error::the wauploader binary was not found under dist/"
            find dist -type f || true
            exit 1
          fi
          # download-artifact extracts the artifact files as 0644: unzip-stream
          # parses the zip's Unix mode but never applies it, so the executable
          # bit of the built binary is lost on the way out of the artifact.
          chmod +x "$bin"
          echo "Binary under test: $bin"

          # The build stage publishes the version it stamped into the binary
          # next to it. The file sits either at the artifact root or next to
          # the binary, depending on the layout the artifact was created with.
          expected_version=""
          for candidate in "dist/VERSION" "$(dirname "$bin")/VERSION"; do
            if [ -f "$candidate" ]; then
              expected_version="$(tr -d '[:space:]' < "$candidate")"
              echo "Expected version (from $candidate): $expected_version"
              break
            fi
          done
          if [ -z "$expected_version" ]; then
            echo "::warning::the artifact carries no VERSION file; the -v check falls back to the weaker assertion"
          fi

          if help_out="$("$bin" -h 2>&1)"; then
            help_code=0
          else
            help_code=$?
          fi
          echo "--- wauploader -h (exit $help_code) ---"
          echo "$help_out"
          if [ "$help_code" -ne 0 ]; then
            echo "::error::wauploader -h exited with $help_code"
            exit 1
          fi
          if [ -z "$help_out" ]; then
            echo "::error::wauploader -h printed nothing"
            exit 1
          fi
          case "$help_out" in
            *wauploader*) ;;
            *)
              echo "::error::the -h output does not mention wauploader"
              exit 1
              ;;
          esac

          if ver_out="$("$bin" -v 2>&1)"; then
            ver_code=0
          else
            ver_code=$?
          fi
          echo "--- wauploader -v (exit $ver_code) ---"
          echo "$ver_out"
          if [ "$ver_code" -ne 0 ]; then
            echo "::error::wauploader -v exited with $ver_code"
            exit 1
          fi
          if [ -z "$ver_out" ]; then
            echo "::error::wauploader -v printed nothing"
            exit 1
          fi
          case "$ver_out" in
            *wauploader*) ;;
            *)
              echo "::error::the -v output does not mention wauploader"
              exit 1
              ;;
          esac
          case "$ver_out" in
            *version*) ;;
            *)
              echo "::error::the -v output is not a version line"
              exit 1
              ;;
          esac
          if [ -n "$expected_version" ]; then
            case "$ver_out" in
              *"$expected_version"*) ;;
              *)
                echo "::error::the -v output does not contain the stamped version $expected_version"
                exit 1
                ;;
            esac
          fi

      - name: Check -h and -v (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $binary = Get-ChildItem -Path dist -Recurse -Filter 'wauploader.exe' -File |
            Select-Object -First 1
          if (-not $binary) {
            Write-Host "::error::the wauploader binary was not found under dist/"
            exit 1
          }
          $path = $binary.FullName
          Write-Host "Binary under test: $path"

          # The build stage publishes the version it stamped into the binary
          # next to it. The file sits either at the artifact root or next to
          # the binary, depending on the layout the artifact was created with.
          $expectedVersion = ''
          foreach ($candidate in @('dist/VERSION', (Join-Path $binary.DirectoryName 'VERSION'))) {
            if (Test-Path -LiteralPath $candidate) {
              $expectedVersion = (Get-Content -LiteralPath $candidate -Raw).Trim()
              Write-Host "Expected version (from $candidate): $expectedVersion"
              break
            }
          }
          if (-not $expectedVersion) {
            Write-Host "::warning::the artifact carries no VERSION file; the -v check falls back to the weaker assertion"
          }

          $helpOut = (& $path -h | Out-String)
          $helpCode = $LASTEXITCODE
          Write-Host "--- wauploader -h (exit $helpCode) ---"
          Write-Host $helpOut
          if ($helpCode -ne 0) {
            Write-Host "::error::wauploader -h exited with $helpCode"
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($helpOut)) {
            Write-Host "::error::wauploader -h printed nothing"
            exit 1
          }
          if ($helpOut -notmatch 'wauploader') {
            Write-Host "::error::the -h output does not mention wauploader"
            exit 1
          }

          $verOut = (& $path -v | Out-String)
          $verCode = $LASTEXITCODE
          Write-Host "--- wauploader -v (exit $verCode) ---"
          Write-Host $verOut
          if ($verCode -ne 0) {
            Write-Host "::error::wauploader -v exited with $verCode"
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($verOut)) {
            Write-Host "::error::wauploader -v printed nothing"
            exit 1
          }
          if ($verOut -notmatch 'wauploader') {
            Write-Host "::error::the -v output does not mention wauploader"
            exit 1
          }
          if ($verOut -notmatch 'version') {
            Write-Host "::error::the -v output is not a version line"
            exit 1
          }
          if ($expectedVersion -and $verOut -notmatch [regex]::Escape($expectedVersion)) {
            Write-Host "::error::the -v output does not contain the stamped version $expectedVersion"
            exit 1
          }

  # ---------------------------------------------------------------- stage 5
  release:
    name: release
    # The release waits for BOTH matrix jobs. A matrix job is only satisfied
    # when every one of its legs passed, so nothing is published unless the
    # whole pipeline is green.
    needs:
      - build
      - verify
    # Tag pushes only. The job-level `if` names no status-check function, so
    # GitHub ANDs it with the implicit `success()`: a failed or skipped
    # dependency keeps the release unpublished. The trigger already limits
    # the workflow to `v*` tags; this gate states the rule again at the job
    # that has the side effect.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The workflow default is `contents: read`; creating a release and
    # uploading its assets needs write access to the repository contents.
    # Job-level permissions REPLACE the workflow-level ones, so every other
    # scope becomes `none` here. That is enough: download-artifact reads the
    # artifacts of the current run through the run's own runtime token, not
    # through GITHUB_TOKEN, and the release needs nothing else.
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      # The tag that triggered this run. `github.ref_name` is the short ref
      # name, so it is exactly the tag (e.g. v0.1.0). The release job needs
      # no checkout for it.
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download the build artifacts
        uses: actions/download-artifact@v8
        with:
          # Every artifact of the build stage, each extracted into a
          # directory named after the artifact. `merge-multiple` is
          # deliberately NOT set: all eight artifacts contain a file called
          # `wauploader`, so merging them into one directory would make the
          # targets overwrite each other.
          pattern: wauploader-*
          path: dist

      - name: Stage the release assets
        run: |
          set -euo pipefail

          # Each artifact directory holds the binary plus a VERSION marker.
          # The release assets are the binaries renamed after their target:
          # the artifact directory is already named `wauploader-<goos>-
          # <goarch>`, and the binary inside keeps the `.exe` suffix of the
          # Windows targets. The VERSION file is a CI-internal marker — the
          # verify stage already asserted the stamped version against it —
          # so it is not published.
          #
          # The binaries of a tag build carry the tag itself as their
          # version: the build job checks out the tag with `fetch-depth: 0`,
          # so the tags are fetched and `git describe --tags` resolves to
          # the tag name (e.g. v0.1.0) rather than to a bare commit id.
          shopt -s nullglob
          dirs=(dist/wauploader-*/)
          if [ "${#dirs[@]}" -ne 8 ]; then
            echo "::error::expected 8 build artifacts, found ${#dirs[@]}" >&2
            exit 1
          fi

          rm -rf release-assets
          mkdir -p release-assets

          for dir in "${dirs[@]}"; do
            name="$(basename "$dir")"

            # `find -print | sed -n '1p'` is portable: macOS/BSD find has no
            # -quit, and sed consumes the whole stream, so there is no
            # SIGPIPE to trip pipefail.
            binary="$(find "$dir" -type f \( -name wauploader -o -name wauploader.exe \) -print 2>/dev/null | sed -n '1p' || true)"
            if [ -z "$binary" ]; then
              echo "::error::no binary found in $dir" >&2
              find "$dir" -type f >&2 || true
              exit 1
            fi
            case "$binary" in
              *.exe) target="$name.exe" ;;
              *) target="$name" ;;
            esac
            cp "$binary" "release-assets/$target"

            # The VERSION file records the version the build stamped into
            # the binary. On a tag build the build stage stamps the
            # TRIGGERING tag, so the assets of this release report the very
            # version they are released under. The comparison is a
            # validation of that invariant, not the mechanism that produces
            # it: a mismatch means the build and the release disagree about
            # the version, and publishing would be wrong.
            version_file="$(find "$dir" -type f -name VERSION -print 2>/dev/null | sed -n '1p' || true)"
            if [ -n "$version_file" ]; then
              version="$(tr -d '[:space:]' < "$version_file")"
              if [ "$version" != "$TAG" ]; then
                echo "::error::$name reports version $version, but the release is tagged $TAG" >&2
                exit 1
              fi
            else
              echo "::warning::$name carries no VERSION file; the stamped version was not cross-checked"
            fi
          done

          ls -l release-assets

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail

          # The checksum file sits next to the binaries it covers, so a user
          # can verify a download with `sha256sum -c SHA256SUMS` in the
          # directory holding the release assets. `rm -f` first and `--`
          # before the glob: the file must not list itself, and the `--`
          # keeps a name that starts with a dash from being read as an
          # option.
          cd release-assets
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Check that the release does not exist yet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # `gh release create` refuses to overwrite a published release on
          # its own, but it does so only after it has already created a
          # draft and uploaded the assets. Checking first turns a re-run of
          # the same tag into a clear, early failure.
          if view_output="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" 2>&1)"; then
            echo "::error::a release for $TAG already exists; refusing to overwrite it" >&2
            exit 1
          fi
          case "$view_output" in
            *"release not found"*) echo "No release for $TAG yet." ;;
            *)
              echo "::error::could not check whether a release for $TAG exists: $view_output" >&2
              exit 1
              ;;
          esac

      - name: Create the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # A quoted heredoc keeps the backticks of the markdown literal:
          # inside single quotes they would be a command substitution, and
          # inside double quotes a `$(...)` in the text would expand.
          notes=$(cat <<'NOTES'
          This release ships 8 prebuilt binaries (linux, darwin, windows on amd64, arm64, 386 and armv7) plus a `SHA256SUMS` checksum file. Verify a download with `sha256sum -c SHA256SUMS`.
          NOTES
          )

          shopt -s nullglob
          assets=(release-assets/*)
          if [ "${#assets[@]}" -ne 9 ]; then
            echo "::error::expected 9 release assets (8 binaries + SHA256SUMS), found ${#assets[@]}" >&2
            exit 1
          fi

          # `--notes` and `--generate-notes` together: the GitHub API
          # prepends the body given with `--notes` to the notes it generates,
          # so the release body opens with the description of the assets and
          # continues with the generated changelog. `--title` is passed
          # explicitly, so the release is titled after the tag instead of the
          # generated one.
          #
          # `--verify-tag` aborts unless the tag already exists in the
          # repository: without it `gh` would create the tag from the
          # default branch and publish a release for the wrong commit.
          #
          # Known GitHub limitation, not a bug here: creating a release
          # with GITHUB_TOKEN fails with 404 when the tagged commit changes
          # a file under .github/workflows/ relative to the default branch
          # (GITHUB_TOKEN cannot be granted the workflow scope). Tagging
          # the tip of main — the normal case — is unaffected, because the
          # workflow file is then identical on both refs. The step fails
          # loudly in that case, so nothing is published.
          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "$notes" \
            --generate-notes \
            --verify-tag

      - name: Print the release URL
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url
