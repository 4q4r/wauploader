# golangci-lint v2 configuration. The pinned binary version and the
# binary↔toolchain pairing landmine are documented in docs/lint.md.
#
# Note on wsl: the plan named `wsl`, which is deprecated since v2.2.0 in
# favor of `wsl_v5` (the linter authors' own replacement — golangci-lint
# prints the migration notice for `wsl`). wsl_v5 is enabled here with the
# settings golangci-lint itself suggests for the migration.
version: "2"

run:
  tests: false # тестовые файлы не анализируются

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gocritic
    - revive
    - ineffassign
    - noctx
    - testifylint
    - wsl_v5
    - varnamelen
    - errchkjson
    - perfsprint
    # Complexity caps (docs/plan.md Task 13): gocyclo 20, gocognit 30,
    # funlen 200, nestif 5.
    - gocyclo
    - gocognit
    - funlen
    - nestif
  settings:
    gocyclo:
      min-complexity: 20
    gocognit:
      min-complexity: 30
    funlen:
      # The plan pins one number (200); both axes follow it so the linter
      # measures what the plan specified. The statements axis' default 40
      # was never sanctioned and flagged legitimately-shaped state machines.
      lines: 200
      statements: 200
    nestif:
      min-complexity: 5
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
    varnamelen:
      # Idiomatic Go scope-brevity: single-letter names carrying conventional
      # meanings are deliberate, not oversights. Type-aware declarations (the
      # linter's sanctioned mechanism), not a blanket length waiver: any short
      # name with another type, or used beyond max-distance, still reports.
      min-name-length: 2
      ignore-decls:
        # strings/bytes in text helpers: Mask, truncate, ParseIATimedelta...
        - s string
        - b []byte
        - b strings.Builder
        - b *bolt.Bucket # bbolt tx.Bucket, journal.go
        - c byte # per-byte percent-encoding loop
        - w io.Writer
        # clients/config/console as parameters, Go receiver style
        - c *Client
        - c *Console
        - c Credentials
        - c auth.Credentials
        - c *config.Config
        - c *counters
        # option structs
        - o spn2.Options
        - o RetryOpts
        - o HeaderOpts
        - o ias3.HeaderOpts
        # paths and small carriers
        - p string
        - p eventPump
        - t string
        - t UploadTarget
        - t runner.UploadTarget
        - t *time.Timer # time.NewTimer
        - t tasksTask # tasks listing elements
        - q url.Values
        - v url.Values
        - v string
        # records, meta, files
        - m ias3.Meta
        - m Meta
        - m *journal.Record # UpdateState mutator
        - m []string # FindStringSubmatch result
        - f *saveFlags
        - f *uploadFlags
        - f itemFileJSON
        - f ias3.ItemFile
        - f *uploadFile
        - f *os.File
        # io and concurrency idioms
        - n int # io.Reader byte count
        - r *Record
        - g *errgroup.Group
        - d time.Duration

issues:
  # Silent caps are a landmine: defaults (50 per linter, 3 identical) hide
  # findings. Zero = report everything.
  max-issues-per-linter: 0
  max-same-issues: 0
