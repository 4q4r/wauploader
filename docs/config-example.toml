# Example wauploader configuration file, annotated with a comment for every key.
#
# Default path: ~/.config/wauploader/wauploader.toml
#   (overridden by the global --config flag)
# Permissions: 0600 — `wauploader init` sets them.
#
# CONFIGURATION VALUES ARE NEVER READ FROM ENVIRONMENT VARIABLES: the whole
# configuration lives only in this file and in the command-line flags. Flags
# take precedence over the file. Unknown keys are not ignored silently —
# wauploader prints a warning naming each such key.
#
# The environment variables the tool does read — NO_COLOR and TERM (the color
# output) and XDG_DATA_HOME (the default journal location) — never supply a
# configuration value.
#
# A missing file is a normal situation (zero-configuration): the default
# values from this example apply.

# ─── archive.org credentials ──────────────────────────────────────────────
[auth]
# IA-S3 keys. Required for `wauploader upload` (IA-S3 does not accept
# cookies). For `save` under auth_mode = "auto" they are used first, the
# cookies being the fallback. Generated at
# https://archive.org/account/s3.php. They must be set TOGETHER: both of
# them or neither (otherwise it is a configuration error). Empty by default;
# `wauploader init` fills them in automatically.
s3_access = ""
s3_secret = ""

# archive.org login cookies (the "logged-in-user" and "logged-in-sig" cookies).
# Optional: under auth_mode = "auto" SPN2 falls back to them when no keys are
# set; auth_mode = "cookies" uses them exclusively. Empty by default.
cookie_user = ""
cookie_sig = ""

# ─── Save Page Now 2 parameters ───────────────────────────────────────────
[spn2]
# Dedup: do not save if a snapshot already exists within the last N.
# IA timedelta form: "120" (a bare number = seconds) or "3d 5h 20m"
# (units d, h, m, s). Off by default (empty string).
# The --if-not-archived-within flag overrides this value.
if_not_archived_within = ""

# All boolean keys below map 1:1 onto the SPN2 options and are off
# (false) by default. The command-line flags turn them on one by one:
#   --capture-all             capture_all: save the full page content
#   --capture-outlinks        capture_outlinks: save the links found on the page
#   --capture-screenshot      capture_screenshot: take a screenshot of the page
#   --delay-wb-availability   delay_wb_availability: delay the snapshot's appearance in Wayback
#   --force-get               force_get: request the save even when a recent snapshot exists
#   --skip-first-archive      skip_first_archive: skip the first archive request
#   --outlinks-availability   outlinks_availability: check the availability of the links
#   --email-result            email_result: send the result by email
capture_all = false
capture_outlinks = false
capture_screenshot = false
delay_wb_availability = false
force_get = false
skip_first_archive = false
outlinks_availability = false
email_result = false

# JS behavior timeout in seconds (0–30; 0 disables JS).
# Defaults to 5. The --js-behavior-timeout flag overrides it.
js_behavior_timeout = 5

# How to save: "auto" — the keys if they are set, otherwise the cookies
# (the default); "keys" — the S3 keys only; "cookies" — the cookies only.
auth_mode = "auto"

# ─── Upload parameters (IA-S3) ────────────────────────────────────────────
[upload]
# REQUIRED, no default: an upload without a collection does not
# run (fail-fast). The --collection flag overrides it.
#collection = "test_collection"

# REQUIRED, no default. Allowed values:
# texts, etree, audio, movies, software, image, data, web.
# The --mediatype flag overrides it.
#mediatype = "data"

# Queue the derive after the upload. Defaults to true.
# --no-derive turns it off; --wait-derive forces it on.
queue_derive = true

# Keep the previous versions of overwritten files. Defaults to true.
# --no-keep-old-version turns it off.
keep_old_version = true

# Priority queue for the derive. Defaults to false.
# The --interactive-priority flag turns it on.
interactive_priority = false

# ─── Rate and concurrency limits ──────────────────────────────────────────
[limits]
# Saves per minute (the archive.org limit for authenticated users: 7/min;
# the default of 5 is ~80% of the limit). Must be at least 1.
save_per_minute = 5

# Parallel saves. Defaults to 4.
save_concurrency = 4

# Parallel IA-S3 uploads. Defaults to 2.
upload_concurrency = 2

# The maximum number of concurrent jobs against one target host. Defaults
# to 3 (politeness towards the target sites).
per_host_concurrency = 3

# How long to wait for one job to finish (an SPN2 save or a derive).
# IA timedelta form ("20m", "1h", "3d 5h 20m"). Defaults to "20m".
job_wait = "20m"

# ─── Console (reserved) ───────────────────────────────────────────────────
# The [console] section is empty for now: the color is controlled by the
# --no-color flag and the NO_COLOR and TERM variables, but not by this file.
