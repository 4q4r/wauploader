# Пример файла конфигурации wauploader с комментариями ко всем ключам.
#
# Путь по умолчанию: ~/.config/wauploader/wauploader.toml
#   (переопределяется глобальным флагом --config)
# Права доступа: 0600 — их устанавливает `wauploader init`.
#
# ПЕРЕМЕННЫЕ ОКРУЖЕНИЯ НЕ ЧИТАЮТСЯ НИКОГДА: вся конфигурация живёт только
# в этом файле и во флагах командной строки. Флаги имеют приоритет над
# файлом. Неизвестные ключи не игнорируются молча — wauploader выводит
# предупреждение с именем каждого такого ключа.
#
# Отсутствующий файл — нормальная ситуация (zero-configuration): применяются
# значения по умолчанию из этого примера.

# ─── Учётные данные archive.org ───────────────────────────────────────────
[auth]
# Ключи IA-S3. Обязательны для `wauploader upload` (cookies IA-S3 не
# принимает); для `save` достаточно кук. Генерируются на
# https://archive.org/account/s3.php. Должны быть заданы ВМЕСТЕ:
# оба или ни одного (иначе — ошибка конфигурации).
# По умолчанию пусто; `wauploader init` заполняет их автоматически.
s3_access = ""
s3_secret = ""

# Куки входа archive.org (cookie "logged-in-user" и "logged-in-sig").
# Необязательны: используются SPN2, когда ключи не заданы или
# auth_mode = "cookies". По умолчанию пусто.
cookie_user = ""
cookie_sig = ""

# ─── Параметры сохранений (Save Page Now 2) ───────────────────────────────
[spn2]
# Дедупликация: не сохранять, если снимок уже есть за последние N.
# Форма IA timedelta: "120" (голое число = секунды) или "3d 5h 20m"
# (единицы d, h, m, s). По умолчанию выключено (пустая строка).
# Флаг --if-not-archived-within переопределяет это значение.
if_not_archived_within = ""

# Все логические ключи ниже соответствуют опциям SPN2 1:1 и по умолчанию
# выключены (false). Флаги командной строки включают их по одному:
#   --capture-all             capture_all: сохранять всё содержимое страницы
#   --capture-outlinks        capture_outlinks: сохранять найденные ссылки
#   --capture-screenshot      capture_screenshot: снять скриншот страницы
#   --delay-wb-availability   delay_wb_availability: отложить появление снимка в Wayback
#   --force-get               force_get: сохранять даже при наличии свежего снимка
#   --skip-first-archive      skip_first_archive: пропустить первый архивный запрос
#   --outlinks-availability   outlinks_availability: проверить доступность ссылок
#   --email-result            email_result: прислать результат письмом
capture_all = false
capture_outlinks = false
capture_screenshot = false
delay_wb_availability = false
force_get = false
skip_first_archive = false
outlinks_availability = false
email_result = false

# Тайм-аут JS-поведения в секундах (0–30; 0 отключает JS).
# По умолчанию 5. Флаг --js-behavior-timeout переопределяет.
js_behavior_timeout = 5

# Чем сохранять: "auto" — ключи, если заданы, иначе куки (по умолчанию);
# "keys" — только ключи S3; "cookies" — только куки.
auth_mode = "auto"

# ─── Параметры загрузок (IA-S3) ───────────────────────────────────────────
[upload]
# ОБЯЗАТЕЛЬНЫ без значения по умолчанию: загрузка без коллекции не
# выполняется (fail-fast). Флаг --collection переопределяет.
#collection = "test_collection"

# ОБЯЗАТЕЛЕН без значения по умолчанию. Допустимые значения:
# texts, etree, audio, movies, software, image, data, web.
# Флаг --mediatype переопределяет.
#mediatype = "data"

# Ставить деривацию в очередь после загрузки. По умолчанию true.
# --no-derive выключает; --wait-derive принудительно включает.
queue_derive = true

# Сохранять прежние версии перезаписываемых файлов. По умолчанию true.
# --no-keep-old-version выключает.
keep_old_version = true

# Приоритетная очередь деривации. По умолчанию false.
# Флаг --interactive-priority включает.
interactive_priority = false

# ─── Ограничения темпа и параллелизма ─────────────────────────────────────
[limits]
# Сохранений в минуту (лимит archive.org для авторизованных: 7/мин;
# по умолчанию 5 — ~80% лимита). 0 — без ограничителя темпа.
save_per_minute = 5

# Параллельных сохранений. По умолчанию 4.
save_concurrency = 4

# Параллельных загрузок IA-S3. По умолчанию 2.
upload_concurrency = 2

# Максимум одновременных задач на один хост-цель. По умолчанию 3
# (вежливость к сайтам-целям).
per_host_concurrency = 3

# Сколько ждать завершения одной задачи (SPN2-сохранение или деривация).
# Форма IA timedelta ("20m", "1h", "3d 5h 20m"). По умолчанию "20m".
job_wait = "20m"

# ─── Консоль (зарезервировано) ────────────────────────────────────────────
# Секция [console] пока пуста: цвет управляется флагом --no-color,
# переменной NO_COLOR и значением TERM, но не конфигурационным файлом.
